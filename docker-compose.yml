version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sun_nestjs_postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: ${DB_NAME:-sun_nestjs_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sun_nestjs_redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  postgres_data:

